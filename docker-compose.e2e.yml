services:
  e2e-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: pescamigos_e2e
      POSTGRES_USER: pescamigos
      POSTGRES_PASSWORD: pescamigos_e2e
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pescamigos -d pescamigos_e2e"]
      interval: 2s
      timeout: 3s
      retries: 20
    tmpfs:
      - /var/lib/postgresql/data
