services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: pescamigos
      POSTGRES_USER: pescamigos
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pescamigos -d pescamigos"]
      interval: 10s
      timeout: 5s
      retries: 10
  app:
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://pescamigos:${POSTGRES_PASSWORD}@db:5432/pescamigos?schema=public
      APP_URL: ${APP_URL:-http://localhost:3000}
      PHOTO_STORAGE_PATH: /data/photos
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-12}
      TILE_URL: ${TILE_URL:-https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png}
      TILE_ATTRIBUTION: ${TILE_ATTRIBUTION:-&copy; OpenStreetMap contributors}
      GEOCODING_URL: ${GEOCODING_URL:-https://nominatim.openstreetmap.org/search}
    volumes:
      - photo_data:/data/photos
    ports:
      - "127.0.0.1:${APP_PORT:-3000}:3000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'node -e "fetch(''http://localhost:3000/login'').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"',
        ]
      interval: 30s
      timeout: 5s
      retries: 5
volumes:
  postgres_data:
  photo_data:
